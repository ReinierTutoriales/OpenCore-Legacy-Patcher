name: Publish verified RC candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main-branch candidate build ID'
        required: true
      source_commit:
        description: 'Full commit SHA used by the approved build'
        required: true
      version:
        description: 'RC version matching the build provenance'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ReinierTutoriales/OpenCore-Legacy-Patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source, download artifacts, check hashes and publish
        run: python3 ci_tooling/publish_candidate.py
