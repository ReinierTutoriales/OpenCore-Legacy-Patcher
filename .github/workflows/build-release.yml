name: Build fork candidate

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches: [main, 'upgrade/**']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Intel candidate
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze > resolved-dependencies.txt
      - name: Verify payload inventory and regression tests
        run: |
          test "$(uname -m)" = "x86_64"
          python ci_tooling/verify_components.py
          python -m unittest discover -s tests -v
          python -m compileall -q opencore_legacy_patcher ci_tooling
      - name: Validate generated configurations and root patch resources
        run: python OpenCore-Patcher-GUI.command --validate
      - name: Prepare assets
        run: python Build-Project.command --run-as-individual-steps --reset-dmg-cache --prepare-assets
      - name: Prepare application
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
        run: >
          python Build-Project.command --run-as-individual-steps
          --reset-pyinstaller-cache --prepare-application
          --git-branch "$BUILD_REF"
          --git-commit-url "https://github.com/$GITHUB_REPOSITORY/commit/$BUILD_SHA"
      - name: Prepare package
        run: python Build-Project.command --run-as-individual-steps --prepare-package
      - name: Check packaged application can launch its CLI
        run: dist/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher --help
      - name: Record checksums and build provenance
        run: |
          python ci_tooling/build_provenance.py
          shasum -a 256 dist/*.pkg > dist/SHA256SUMS.txt
          cp resolved-dependencies.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher.pkg
          path: dist/OpenCore-Patcher.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: dist/AutoPkg-Assets.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Uninstaller.pkg
          path: dist/OpenCore-Patcher-Uninstaller.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Intel-build-info
          path: |
            dist/SHA256SUMS.txt
            dist/build-provenance.json
            dist/resolved-dependencies.txt
          if-no-files-found: error
