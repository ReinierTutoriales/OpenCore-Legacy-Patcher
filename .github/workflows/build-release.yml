name: Build OCLP Release (unsigned)

# Build Intel (x86_64) — runners macos-14/15 por defecto son Apple Silicon.
# Para Intel hay que usar el label macos-15-intel de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-intel:
    name: Build OpenCore-Patcher (Intel x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Intel architecture
        run: |
          echo "uname -m: $(uname -m)"
          python -c "import platform; print(platform.machine())"
          test "$(uname -m)" = "x86_64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Build info
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VER="$(python -c "from opencore_legacy_patcher.constants import Constants; print(Constants().patcher_version)")"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building OCLP $VER @ $SHA with $(python -V) on $(uname -m)"

      - name: Prepare assets
        run: |
          python Build-Project.command \
            --run-as-individual-steps \
            --reset-dmg-cache \
            --prepare-assets

      - name: Prepare application (unsigned, x86_64)
        run: |
          python Build-Project.command \
            --run-as-individual-steps \
            --reset-pyinstaller-cache \
            --prepare-application \
            --git-branch "${{ steps.meta.outputs.branch }}" \
            --git-commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --git-commit-date "${{ steps.meta.outputs.date }}"

      - name: Prepare package (unsigned)
        run: |
          python Build-Project.command \
            --run-as-individual-steps \
            --prepare-package

      - name: List dist
        run: |
          ls -lah dist/ || true
          find dist -maxdepth 2 -type f 2>/dev/null | head -50
          file dist/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-${{ steps.meta.outputs.version }}-intel-x86_64-${{ steps.meta.outputs.sha }}
          path: |
            dist/OpenCore-Patcher.pkg
            dist/OpenCore-Patcher-Uninstaller.pkg
            dist/AutoPkg-Assets.pkg
            dist/OpenCore-Patcher.app
          if-no-files-found: warn

      - name: Release notes
        run: |
          cat > ReleaseNotes.md << EOF
          ## OpenCore Legacy Patcher ${{ steps.meta.outputs.version }} — **Intel (x86_64)**

          - **Base:** [TechPrototyper/OpenCore-Legacy-Patcher](https://github.com/TechPrototyper/OpenCore-Legacy-Patcher)
          - **Commit:** \`${{ steps.meta.outputs.sha }}\`
          - **Arquitectura:** **x86_64 (Intel)** — runner \`macos-15-intel\`
          - **Firma / notarización:** **no**

          ### Assets
          | Archivo | Uso |
          |---------|-----|
          | \`OpenCore-Patcher.pkg\` | Instalador (Macs Intel / Hackintosh) |
          | \`OpenCore-Patcher-Uninstaller.pkg\` | Desinstalador |
          | \`AutoPkg-Assets.pkg\` | Assets internos |

          > No es el release oficial de Dortania. Build unsigned.

          Créditos: Dortania · TechPrototyper · Acidanthera
          EOF

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.meta.outputs.version }}-intel-${{ steps.meta.outputs.sha }}"
          name: "OCLP ${{ steps.meta.outputs.version }} — Intel x86_64 (${{ steps.meta.outputs.sha }})"
          bodyFile: ReleaseNotes.md
          artifacts: "dist/OpenCore-Patcher.pkg,dist/OpenCore-Patcher-Uninstaller.pkg,dist/AutoPkg-Assets.pkg"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
