name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: TechPrototyper/OpenCore-Legacy-Patcher
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare spec
        run: |
          test "$(uname -m)" = "x86_64"
          sed -i '' 's/target_arch="universal2"/target_arch="x86_64"/' OpenCore-Patcher-GUI.spec

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt

      - name: Prepare assets
        run: |
          python Build-Project.command --run-as-individual-steps --reset-dmg-cache --prepare-assets

      - name: Prepare application
        run: |
          python Build-Project.command --run-as-individual-steps --reset-pyinstaller-cache --prepare-application

      - name: Prepare package
        run: |
          python Build-Project.command --run-as-individual-steps --prepare-package
          ls -lh dist/*.pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher
          path: |
            dist/OpenCore-Patcher.pkg
            dist/OpenCore-Patcher-Uninstaller.pkg
            dist/AutoPkg-Assets.pkg
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER_REPO="${GITHUB_REPOSITORY}"
          for i in 1 2 3 4 5; do
            gh release delete 2.5.0 --repo "$OWNER_REPO" --yes --cleanup-tag 2>/dev/null || true
            if gh release create 2.5.0 \
              dist/OpenCore-Patcher.pkg \
              dist/OpenCore-Patcher-Uninstaller.pkg \
              dist/AutoPkg-Assets.pkg \
              --repo "$OWNER_REPO" \
              --title "2.5.0" \
              --latest; then
              exit 0
            fi
            echo "retry $i"
            sleep 20
          done
          exit 1
